<!DOCTYPE html>

<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Vivero Salvia · Reservas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

<body>
<main class="wrap section">
  <header class="hero">
    <span class="eyebrow">Reservas · Talleres</span>
    <h1>Asegura tu lugar<br/>en el invernadero</h1>
    <p class="lead">Completa el formulario y nuestro equipo confirmará tu reserva en menos de 24 horas.</p>
  </header>

  <form id="reservaForm" class="form glass" novalidate>
    <div class="field">
      <label for="nombre">Nombre</label>
      <input id="nombre" type="text" required placeholder="Camila Riera"/>
    </div>
    <div class="field">
      <label for="email">Correo</label>
      <input id="email" type="email" required placeholder="hola@correo.com"/>
    </div>
    <div class="field">
      <label for="taller">Taller</label>
      <select id="taller" required>
        <option value="">Elige uno…</option>
        <option>Bonsái urbano · 07 May</option>
        <option>Kokedama · 14 May</option>
        <option>Compostaje en casa · 21 May</option>
        <option>Suculentas y luz · 28 May</option>
        <option>Hierbas aromáticas · 04 Jun</option>
        <option>Poda consciente · 11 Jun</option>
      </select>
    </div>
    <div class="field">
      <label for="personas">Personas</label>
      <input id="personas" type="number" min="1" max="6" value="1"/>
    </div>
    <div class="field full">
      <label for="notas">Notas</label>
      <textarea id="notas" placeholder="¿Alergias, nivel de experiencia, alguna planta favorita?"></textarea>
    </div>
    <div class="full">
      <button class="btn coral" type="submit">Reservar lugar</button>
      <p id="toast" class="toast">Gracias · te escribiremos al correo para confirmar.</p>
    </div>
  </form>
</main>
